name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ hashFiles('tools/build_dist.cjs') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        if: ${{ hashFiles('tools/build_dist.cjs') != '' }}
        run: python3 -m pip install lxml "Pillow>=10"

      - name: Build public directory
        if: ${{ hashFiles('tools/build_dist.cjs') != '' }}
        run: node tools/build_dist.cjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRESSROOM_GCIM }}
          channelId: live
          projectId: pressroom-gcim
