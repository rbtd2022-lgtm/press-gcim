name: Deploy static dist to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public directory
        run: |
          if [ -f tools/build_dist.cjs ]; then
            node tools/build_dist.cjs
          else
            mkdir -p dist
            cp -R assets scripts dist/
            find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.xml' -o -name 'CNAME' -o -name '_headers' -o -name 'robots.txt' -o -name 'search-index.json' \) ! -name 'mobile-emulator.html' -exec cp {} dist/ \;
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
