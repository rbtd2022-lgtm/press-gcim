name: Deploy static dist to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ready public files
        shell: bash
        run: |
          publish_dir="$RUNNER_TEMP/gcim-pages"
          mkdir -p "$publish_dir"
          cp -R assets scripts "$publish_dir/"
          for file in *.html; do
            [ "$file" = "mobile-emulator.html" ] || cp "$file" "$publish_dir/"
          done
          for file in sitemap*.xml CNAME _headers robots.txt search-index.json; do
            [ ! -f "$file" ] || cp "$file" "$publish_dir/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gcim-pages
      - uses: actions/deploy-pages@v4
        id: deployment
