<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCIM Mobile Device Emulator</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#eceff2;
    color:#172433;
    font-family:Arial,Helvetica,sans-serif;
  }
  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    background:#102c46;
    color:#fff;
    border-bottom:1px solid rgba(255,255,255,.18);
  }
  .toolbar strong{
    margin-right:8px;
    font-size:14px;
    letter-spacing:.03em;
  }
  .toolbar select,.toolbar button{
    height:38px;
    border:1px solid rgba(255,255,255,.55);
    border-radius:7px;
    padding:0 12px;
    font:inherit;
  }
  .toolbar select{
    background:#fff;
    color:#102c46;
  }
  .toolbar button{
    background:transparent;
    color:#fff;
    cursor:pointer;
  }
  .toolbar button:hover{background:rgba(255,255,255,.1)}
  .size-label{
    margin-left:auto;
    font-size:12px;
    color:#cdd8e2;
  }
  .stage{
    padding:28px 18px 50px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:auto;
  }
  .phone{
    position:relative;
    width:438px;
    padding:18px;
    border-radius:48px;
    background:#151719;
    box-shadow:0 18px 50px rgba(0,0,0,.22);
    transition:width .2s ease;
  }
  .speaker{
    width:92px;
    height:8px;
    margin:0 auto 12px;
    border-radius:20px;
    background:#34383c;
  }
  .screen-shell{
    overflow:hidden;
    border-radius:30px;
    background:#fff;
  }
  iframe{
    display:block;
    width:390px;
    height:844px;
    border:0;
    background:#fff;
    transition:width .2s ease,height .2s ease;
  }
  .home-indicator{
    width:115px;
    height:5px;
    margin:13px auto 0;
    border-radius:20px;
    background:#4a4d50;
  }
  .note{
    max-width:780px;
    margin:0 auto 22px;
    padding:0 18px;
    color:#55616d;
    font-size:13px;
    line-height:1.5;
    text-align:center;
  }
  @media(max-width:600px){
    .toolbar{position:static}
    .size-label{width:100%;margin-left:0}
    .stage{justify-content:flex-start}
  }
</style>
</head>
<body>
<div class="toolbar">
  <strong>GCIM Mobile Emulator</strong>
  <select id="device" aria-label="Устройство">
    <option value="390x844">iPhone 14 / 15 — 390 × 844</option>
    <option value="393x852">iPhone 15 Pro — 393 × 852</option>
    <option value="430x932">iPhone 15 Pro Max — 430 × 932</option>
    <option value="360x800">Android compact — 360 × 800</option>
    <option value="412x915">Android large — 412 × 915</option>
  </select>
  <button id="rotate" type="button">↻ Повернуть</button>
  <button id="reload" type="button">↺ Перезагрузить сайт</button>
  <span class="size-label" id="sizeLabel">390 × 844 px</span>
</div>

<div class="note">
  Это интерактивная версия: внутри телефона можно прокручивать страницу, открывать меню, пользоваться поиском, фильтрами и переключать языки.
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div class="speaker"></div>
    <div class="screen-shell">
      <iframe id="siteFrame" title="GCIM Press Office mobile preview"></iframe>
    </div>
    <div class="home-indicator"></div>
  </div>
</div>

<script>
(function(){
  const frame = document.getElementById('siteFrame');
  const device = document.getElementById('device');
  const rotate = document.getElementById('rotate');
  const reload = document.getElementById('reload');
  const phone = document.getElementById('phone');
  const sizeLabel = document.getElementById('sizeLabel');

  let landscape = false;

  function loadSite(){
    frame.src = 'index.html';
  }

  function applySize(){
    let [w,h] = device.value.split('x').map(Number);
    if(landscape) [w,h] = [h,w];
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    phone.style.width = (w + 48) + 'px';
    sizeLabel.textContent = w + ' × ' + h + ' px';
  }

  device.addEventListener('change', applySize);

  rotate.addEventListener('click', function(){
    landscape = !landscape;
    applySize();
  });

  reload.addEventListener('click', function(){
    loadSite();
  });

  applySize();
  loadSite();
})();
</script>
</body>
</html>
