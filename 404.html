<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Global Citizens — page not found">
  <title>Page not found — Global Citizens</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background:#f6f3ec;color:#102133;font-family:Arial,Helvetica,sans-serif}
    .topline{height:4px;background:#a78248}
    main{width:min(760px,calc(100% - 40px));margin:8vh auto;padding:48px;background:#fff;border-top:5px solid #102c46}
    .brand{display:inline-flex;align-items:center;gap:14px;color:#102133;text-decoration:none}
    .brand img{width:64px;height:64px;object-fit:contain}
    .brand strong{font-family:Georgia,"Times New Roman",serif;font-size:21px}
    .code{margin-top:58px;color:#84652f;font-size:14px;font-weight:700;letter-spacing:.15em}
    h1{margin:12px 0 18px;font:500 clamp(34px,7vw,58px)/1.08 Georgia,"Times New Roman",serif}
    p{font-size:17px;line-height:1.6}
    .home{display:inline-block;margin-top:22px;color:#102c46;font-weight:700;text-underline-offset:4px}
    nav{display:flex;flex-wrap:wrap;gap:14px;margin-top:48px;padding-top:22px;border-top:1px solid #d8d7d1}
    nav a{color:#44515e;font-size:13px}
    a:focus-visible{outline:3px solid #84652f;outline-offset:4px}
    @media(max-width:560px){main{width:min(100% - 24px,760px);margin:24px auto;padding:30px 22px}.code{margin-top:40px}}
  
    /* GCIM mobile viewport lock */
    @media (max-width:840px) {
      html, body { width:100%; max-width:100%; overflow-x:hidden; }
      .masthead-inner, .nav, .content, .hero, .featured, .footer-inner,
      .publication-shell, .inquiries-wrap, .about-wrap { min-width:0; max-width:100%; }
      .brand, .brand-copy, .mobile-actions, .nav-links, .news-item, .news-title,
      .publication-title, .publication-body, .resource-item, .resource-title,
      .service-value { min-width:0; max-width:100%; }
      .brand-copy { overflow:hidden; }
      .brand-copy strong { white-space:normal; overflow-wrap:anywhere; }
      .publication-title, .publication-body, .news-title, .news-type, .news-date,
      .hero h1, .inquiries-copy, .contact-value { overflow-wrap:anywhere; word-break:normal; }
      .publication-body .quote-attribution-inline { white-space:normal; overflow-wrap:anywhere; }
      .resource-item { flex-wrap:wrap; }
      .resource-title { overflow-wrap:anywhere; }
      img, svg, video, iframe { max-width:100%; height:auto; }
    }
    @media (max-width:380px) {
      .masthead-inner { padding-left:10px; padding-right:10px; gap:6px; }
      .brand { gap:7px; }
      .mark { width:42px; height:42px; }
      .brand-copy strong { font-size:16px; line-height:1.1; }
      .brand-copy span { font-size:9px; letter-spacing:.08em; }
      .mobile-actions { gap:5px; }
      .mobile-lang { min-width:52px; width:52px; padding-left:5px; padding-right:5px; }
      .menu-toggle { width:38px; height:38px; }
      .content, .hero, .featured, .publication-shell, .inquiries-wrap { padding-left:14px; padding-right:14px; }
    }

  
    /* GCIM responsive typography */
    html{font-size:16px}
    h1,
    .publication-title{font-size:40px;line-height:1.2}
    .featured h2,
    .news-title{font-size:24px;line-height:1.3}
    .featured-meta,
    .featured-meta span,
    #featuredDate,
    .news-type,
    .news-date,
    .publication-meta,
    .publication-category{font-size:14px}
    .subscribe-form input{font-size:16px;line-height:1.4}
    .subscribe-form button,
    .pagination button{font-size:16px;line-height:1.2}
    .lang,
    .mobile-lang{font-size:16px}
    .track-two,
    .subscribe-note,
    .contact-label{font-size:12px}
    @media (min-width:768px) and (max-width:1023px){
      h1,
      .publication-title{font-size:32px;line-height:1.25}
    }
    @media (max-width:767px){
      h1,
      .publication-title{font-size:26px;line-height:1.25}
      .featured h2,
      .news-title{font-size:20px;line-height:1.3}
      .featured-meta,
      .featured-meta span,
      #featuredDate,
      .news-type,
      .news-date,
      .publication-meta,
      .publication-category{font-size:12px;line-height:1.3}
      .portal-bar-inner{font-size:12px!important;line-height:1.2}
      .nav-links{font-size:13px}
      .footer-subscribe h3,
      .subscribe-note,
      .copyright{font-size:12px}
    }
    @media (max-width:480px){
      h1,
      .publication-title{line-height:1.25}
      .featured h2,
      .news-title{line-height:1.3}
      .brand-copy span{font-size:12px}
    }


    /* Mobile header fit and alignment */
    @media (max-width:840px){
      .portal-bar-inner{
        width:100%;
        max-width:100%;
        padding:8px 14px;
        font-size:11px!important;
        line-height:1.25;
        letter-spacing:.06em!important;
        text-align:center;
        white-space:normal;
        overflow:visible;
      }
      .masthead-inner{
        width:100%;
        max-width:100%;
        min-height:80px;
        padding:12px 14px;
        grid-template-columns:minmax(0,1fr) auto;
        gap:8px;
      }
      .brand{
        min-width:0;
        max-width:100%;
        gap:8px;
      }
      .mark{
        width:50px;
        height:50px;
        flex:0 0 50px;
      }
      .brand-copy{
        min-width:0;
        max-width:100%;
        overflow:hidden;
      }
      .brand-copy strong{
        font-size:16px;
        line-height:1.1;
        white-space:nowrap;
      }
      .brand-copy span{
        margin-top:3px;
        font-size:10px;
        line-height:1.2;
        letter-spacing:.09em;
        white-space:normal;
        overflow-wrap:normal;
      }
      .mobile-actions{
        flex:0 0 auto;
        gap:7px;
      }
      .mobile-lang-wrap::after{
        content:"";
        position:absolute;
        top:50%;
        right:13px;
        width:7px;
        height:7px;
        border-right:1.5px solid #fff;
        border-bottom:1.5px solid #fff;
        transform:translateY(-65%) rotate(45deg);
        pointer-events:none;
      }
      .mobile-lang{
        -webkit-appearance:none;
        appearance:none;
        display:block;
        width:64px;
        min-width:64px;
        height:40px;
        padding:0 26px 0 12px;
        font-size:14px;
        line-height:1;
        letter-spacing:.04em;
        direction:ltr;
        text-align:left;
        text-align-last:left;
      }
      .menu-toggle{
        width:40px;
        height:40px;
        flex:0 0 40px;
      }
    }
    @media (max-width:480px){
      .portal-bar-inner{
        padding-inline:10px;
        font-size:10px!important;
        letter-spacing:.04em!important;
      }
      .masthead-inner{padding:10px;gap:6px}
      .brand{gap:7px}
      .mark{width:44px;height:44px;flex-basis:44px}
      .brand-copy strong{font-size:15px}
      .brand-copy span{font-size:9px;letter-spacing:.06em}
      .mobile-actions{gap:6px}
      .mobile-lang-wrap::after{right:11px;width:6px;height:6px}
      .mobile-lang{
        width:58px;
        min-width:58px;
        height:38px;
        padding:0 22px 0 10px;
        font-size:13px;
      }
      .menu-toggle{width:38px;height:38px;flex-basis:38px}
    }
    @media (max-width:340px){
      .masthead-inner{padding-inline:8px;gap:5px}
      .brand{gap:6px}
      .mark{width:40px;height:40px;flex-basis:40px}
      .brand-copy strong{font-size:14px}
      .brand-copy span{font-size:9px;letter-spacing:.03em}
      .mobile-actions{gap:5px}
      .mobile-lang{width:56px;min-width:56px}
      .menu-toggle{width:36px;height:36px;flex-basis:36px}
    }
  
    /* Desktop editorial refinement: official portal line and language navigation */
    @media (min-width:841px){
      .portal-bar-inner{
        padding-top:9px;
        padding-bottom:9px;
        font-size:11px;
        font-weight:400;
        letter-spacing:.08em;
        text-transform:none;
      }
      .lang{
        gap:0;
        padding:0;
        border:0;
        border-radius:0;
        background:transparent;
        box-shadow:none;
        font-size:11px;
        font-weight:600;
        letter-spacing:.08em;
      }
      .lang :is(a,button){
        min-width:0;
        height:32px;
        padding:0 10px;
        border-radius:0;
        color:rgba(255,255,255,.72);
        box-shadow:none;
      }
      .lang :is(a,button) + :is(a,button){
        border-left:1px solid rgba(255,255,255,.28);
      }
      .lang :is(a,button).active{
        position:relative;
        background:transparent;
        color:#fff;
        box-shadow:none;
      }
      .lang :is(a,button).active::after{
        content:"";
        position:absolute;
        right:10px;
        bottom:2px;
        left:10px;
        height:2px;
        background:#d7bd90;
      }
      .lang :is(a,button):hover:not(.active){
        background:transparent;
        color:#fff;
      }
    }
  
    /* Desktop navigation and subscribe control refinement */
    @media (min-width:841px){
      .nav-links{
        gap:30px;
        font-size:12px;
        font-weight:500;
        letter-spacing:.065em;
      }
      .nav-links a{
        padding-top:20px;
        padding-bottom:18px;
      }
      .media-link{
        font-size:11px;
        font-weight:600;
        letter-spacing:.07em;
        padding-left:22px;
      }
      .subscribe-form button{
        min-height:34px;
        padding:0 14px;
        font-size:11px;
        font-weight:600;
        letter-spacing:.08em;
      }
    }
  </style>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Global Citizens">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Page not found — Global Citizens">
  <meta property="og:description" content="Global Citizens — page not found">

</head>
<body>
  <div class="topline"></div>
  <main>
    <a class="brand" id="brand" href="index.html" aria-label="Global Citizens home">
      <img src="assets/gcim-emblem.webp" alt="" width="64" height="64">
      <strong>Global Citizens</strong>
    </a>
    <div class="code">404</div>
    <h1 id="title">Page not found</h1>
    <p id="message">The requested page could not be found.</p>
    <a class="home" id="home" href="index.html">Return to the news</a>
    <nav aria-label="Language">
      <a href="index.html" lang="en">English</a>
      <a href="index-ar.html" lang="ar" dir="rtl">العربية</a>
      <a href="index-es.html" lang="es">Español</a>
      <a href="index-zh.html" lang="zh-Hans">中文</a>
      <a href="index-ru.html" lang="ru">Русский</a>
      <a href="index-fr.html" lang="fr">Français</a>
      <a href="index-uk.html" lang="uk">Українська</a>
    </nav>
  </main>
  <script>
    (function(){
      'use strict';
      const content={
        en:['Page not found','The requested page could not be found.','Return to the news','Global Citizens home'],
        ar:['الصفحة غير موجودة','تعذر العثور على الصفحة المطلوبة.','العودة إلى الأخبار','الصفحة الرئيسية لـ Global Citizens'],
        es:['Página no encontrada','No se ha encontrado la página solicitada.','Volver a las noticias','Página principal de Global Citizens'],
        zh:['未找到页面','未找到您请求的页面。','返回新闻','Global Citizens 首页'],
        ru:['Страница не найдена','Запрошенная страница не найдена.','Перейти к новостям','Главная страница Global Citizens'],
        fr:['Page introuvable','La page demandée est introuvable.','Retour aux actualités','Accueil de Global Citizens'],
        uk:['Сторінку не знайдено','Запитану сторінку не знайдено.','Перейти до новин','Головна сторінка Global Citizens']
      };
      let lang='en';
      try{const saved=localStorage.getItem('gcimPreferredLanguage');if(content[saved])lang=saved}catch(e){}
      document.documentElement.lang=lang;
      document.documentElement.dir=lang==='ar'?'rtl':'ltr';
      document.title=content[lang][0]+' — Global Citizens';
      document.getElementById('title').textContent=content[lang][0];
      document.getElementById('message').textContent=content[lang][1];
      document.getElementById('home').textContent=content[lang][2];
      document.getElementById('brand').setAttribute('aria-label',content[lang][3]);
      document.getElementById('home').href=(lang==='en'?'index.html':'index-'+lang+'.html');
      document.getElementById('brand').href=(lang==='en'?'index.html':'index-'+lang+'.html');
    })();
  </script>
</body>
</html>
